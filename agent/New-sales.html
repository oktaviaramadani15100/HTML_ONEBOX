<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Sales SPV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            margin: 0;
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content {
            padding: 16px;
            width: 100%;
            box-sizing: border-box;
            flex: 1;
            font-family: 'Segoe UI', sans-serif;
            padding-bottom: 120px;
            overflow-y: auto;
            scrollbar-width: thin; 
            scrollbar-color: #cbd5e1 #f9fafb;
        }

        .form-section-sales {
            margin-bottom: 24px;
        }

        .form-section-sales h3 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 12px;
        }

        .form-grid-sales {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #555;
        }

        input,
        select {
            font-size: 0.85rem;
            padding: 8px 3px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
        }

        .required-star {
            color: red;
        }

        .button-group-sales {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .save-button-sales {
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .save-button-sales:hover {
            background-color: #452cf1;
        }

        .close-button-sales {
            background-color: #e5e5e5;
            color: #333;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .form-grid-sales {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="header-container"></div>

        <div class="content">
            <form>
                <div class="form-section-sales">
                    <h3>Basic Information</h3>
                    <div class="form-grid-sales">
                        <div class="form-group">
                            <label>Name <span class="required-star">*</span></label>
                            <input type="text" placeholder="Fill Name" />
                        </div>
                        <div class="form-group">
                            <label>Contact Source</label>
                            <select>
                                <option>Select Contact Source</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="Fill Email" />
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" placeholder="Fill Phone Number" />
                        </div>
                    </div>
                </div>

                <div class="form-section-sales">
                    <h3>Assignment</h3>
                    <div class="form-grid-sales">
                        <div class="form-group">
                            <label>Handler <span class="required-star">*</span></label>
                            <select>
                                <option>Select Handler</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Branch</label>
                            <select>
                                <option>Select Branch</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section-sales">
                    <h3>Opportunity Details</h3>
                    <div class="form-grid-sales">
                        <div class="form-group">
                            <label>Campaign <span class="required-star">*</span></label>
                            <select>
                                <option>Select Campaign</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Close Target</label>
                            <input type="date" />
                        </div>
                        <div class="form-group">
                            <label>Product</label>
                            <select>
                                <option>Select Product</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Potential Value</label>
                            <input type="text" placeholder="Potential Value (Rp)" />
                        </div>
                    </div>
                </div>

                <div class="button-group-sales">
                    <button type="submit" class="save-button-sales">Save</button>
                    <button type="button" class="close-button-sales">Close</button>
                </div>
            </form>
        </div>

        <div id="bottom-nav-container"></div>
    </div>

    <script>
        fetch('../agent/layout.html')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(data, 'text/html');

                const layoutStyles = doc.querySelectorAll('style');
                layoutStyles.forEach(style => {
                    const newStyle = document.createElement('style');
                    newStyle.textContent = style.textContent;
                    document.head.appendChild(newStyle);
                });

                const layoutLinks = doc.querySelectorAll('link');
                layoutLinks.forEach(link => {
                    if (link.href.includes('style.css')) {
                        const newLink = document.createElement('link');
                        newLink.rel = 'stylesheet';
                        newLink.href = '../agent/css/style.css';
                        document.head.appendChild(newLink);
                    }
                });

                const header = doc.querySelector('.header').cloneNode(true);
                document.getElementById('header-container').appendChild(header);
                const headerTitle = document.querySelector('#header-container .header-name');
                headerTitle.innerHTML = `<i class="fas fa-arrow-left"></i> <span style="margin-left: 16px;">New Sales</span>`;
                headerTitle.onclick = handleBack;

                const bottomNav = doc.querySelector('.bottom-nav').cloneNode(true);
                if (bottomNav) {
                    document.getElementById('bottom-nav-container').appendChild(bottomNav);
                } else {
                    console.error('Bottom navigation not found in layout.html');
                }

                const layoutScripts = doc.querySelectorAll('script');
                layoutScripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = '../agent/js/script.js';
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });

                const navNew = document.querySelector('.nav-new');
                if (navNew) navNew.classList.add('active');
            })
            .catch(error => console.error('Error fetching layout.html:', error));

        function handleBack() {
            window.location.href = '../agent/home.html';
        }
    </script>
