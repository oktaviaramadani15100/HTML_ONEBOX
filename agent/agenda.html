<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f3f4f6;
        display: flex;
        justify-content: center;
    }

    .wrapper {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        min-height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .calendar-box {
        padding: 20px;
        background-color: #fefefe;
        box-shadow: inset 0 0 0 1px #eee;
    }

    .calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .calendar-header h3 {
        margin: 0;
        color: #1d0c80;
    }

    .calendar-header button {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: #1d0c80;
    }

    .calendar-table {
        width: 100%;
        text-align: center;
        table-layout: fixed;
        border-collapse: collapse;
    }

    .calendar-table td {
        width: 40px !important;
        height: 40px !important;
        padding: 0 !important;
        margin: 0 auto !important;
        line-height: 40px !important;
        border-radius: 50% !important;
        vertical-align: middle !important;
        text-align: center;
    }

    .calendar-table td:hover {
        background: #bcc2c7;
        color: white;
    }

    .calendar-table .active {
        background: #1d0c80;
        color: white;
    }

    .agenda-box {
        margin-top: 20px;
    }

    .agenda-item {
        background: #f3efff;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .agenda-location {
        font-size: 0.85em;
        color: #666;
        margin-top: 2px;
    }

    .agenda-title {
        font-weight: 600;
        color: #1d0c80;
    }

    .agenda-note {
        font-size: 13px;
        color: #555;
    }

    .agenda-time {
        font-weight: 500;
        font-size: 13px;
        color: #222;
    }
</style>

<body>
    <div class="wrapper">
        <div id="header-container"></div>

        <div class="calendar-box">
            <div class="calendar-header">
                <h3><span id="month">January</span> <span id="year">2025</span></h3>
                <div>
                    <button id="prev">&#10094;</button>
                    <button id="next">&#10095;</button>
                </div>
            </div>
            <table class="calendar-table">
                <thead>
                    <tr>
                        <th>Sun</th>
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thu</th>
                        <th>Fri</th>
                        <th>Sat</th>
                    </tr>
                </thead>
                <tbody id="calendar-body"></tbody>
            </table>

            <div class="agenda-box" id="agenda-box"></div>
        </div>


        <!-- Bottom Nav -->
        <div class="bottom-nav">
            <div class="nav-wrapper">
                <div class="nav-home">
                    <a href="../agent/home.html"><i class="fas fa-home"></i></a>
                    <p>Home</p>
                </div>

                <div class="nav-history">
                    <a href="../agent/history-call.html"><i class="fas fa-file-alt"></i></a>
                    <p>History</p>
                </div>

                <div class="nav-spacer"></div>

                <div class="nav-call">
                    <a href="../agent/call.html"><i class="fas fa-phone-alt"></i></a>
                    <p>Call</p>
                </div>

                <div class="nav-agen">
                    <a href="../agent/agenda.html"><i class="fas fa-calendar-alt"></i></a>
                    <p>Agenda</p>
                </div>
            </div>

            <div class="nav-new">
                <a href="../agent/New-sales.html" class="plus-btn"><i class="fas fa-plus"></i></a>
                <p>New</p>
            </div>
        </div>

        <div id="bottom-nav-container"></div>
    </div>

<script>
        fetch('../agent/layout.html')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(data, 'text/html');

                const layoutStyles = doc.querySelectorAll('style');
                layoutStyles.forEach(style => {
                    const newStyle = document.createElement('style');
                    newStyle.textContent = style.textContent;
                    document.head.appendChild(newStyle);
                });

                const layoutLinks = doc.querySelectorAll('link');
                layoutLinks.forEach(link => {
                    if (link.href.includes('style.css')) {
                        const newLink = document.createElement('link');
                        newLink.rel = 'stylesheet';
                        newLink.href = '../agent/css/style.css';
                        document.head.appendChild(newLink);
                    }
                });

                const header = doc.querySelector('.header').cloneNode(true);
                document.getElementById('header-container').appendChild(header);
                const headerTitle = document.querySelector('#header-container .header-name');
                headerTitle.innerHTML = `<i class="fas fa-arrow-left"></i> <span style="margin-left: 16px;">Agenda Agent</span>`;
                headerTitle.onclick = handleBack;

                const bottomNav = doc.querySelector('.bottom-nav').cloneNode(true);
                if (bottomNav) {
                    document.getElementById('bottom-nav-container').appendChild(bottomNav);
                } else {
                    console.error('Bottom navigation not found in layout.html');
                }

                const layoutScripts = doc.querySelectorAll('script');
                layoutScripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = '../agent/js/script.js';
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });

                const navAgen = document.querySelector('.nav-agen');
                if (navAgen) navAgen.classList.add('active');
            })
            .catch(error => console.error('Error fetching layout.html:', error));

    function toggleDropdown() {
        const dropdown = document.getElementById('dropdownMenu');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    window.addEventListener('click', function (e) {
        const dropdown = document.getElementById('dropdownMenu');
        const icon = document.querySelector('.fa-ellipsis-v');

        if (!e.target.closest('#dropdownMenu') && !e.target.closest('.fa-ellipsis-v')) {
            dropdown.style.display = 'none';
        }
    });

    const calendarBody = document.getElementById('calendar-body');
    const monthLabel = document.getElementById('month');
    const yearLabel = document.getElementById('year');
    const agendaBox = document.getElementById('agenda-box');

    const today = new Date();
    let currentMonth = today.getMonth();
    let currentYear = today.getFullYear();


    const months = ["January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"];

    const agendas = {
        '2025-07-23': [
            {
                title: "Sharing Produk Banca",
                note: "Dengan Pak Anto",
                time: "09:00–11:00",
                location: "Ruang Rapat Lt.2"
            },
            {
                title: "Follow-Up Proposal Polis",
                note: "Pak Iwan",
                time: "13:00–14:00",
                location: "Zoom Meeting"
            },
            {
                title: "Janji Temu Prospect",
                note: "Hamidah",
                time: "15:00–16:00",
                location: "Kafe Bintaro"
            }
        ],
        '2025-07-25': [
            {
                title: "Meeting Internal",
                note: "Divisi Marketing",
                time: "10:00–12:00",
                location: "Ruang Diskusi Lt.3"
            }
        ]
    };


    function generateCalendar(month, year) {
        calendarBody.innerHTML = "";
        monthLabel.textContent = months[month];
        yearLabel.textContent = year;

        const firstDay = new Date(year, month).getDay();
        const daysInMonth = 32 - new Date(year, month, 32).getDate();

        let date = 1;
        let firstActiveCell = null;
        for (let i = 0; i < 6; i++) {
            const row = document.createElement("tr");
            for (let j = 0; j < 7; j++) {
                const cell = document.createElement("td");
                if (i === 0 && j < firstDay) {
                    cell.textContent = "";
                } else if (date > daysInMonth) {
                    break;
                } else {
                    cell.textContent = date;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                    cell.addEventListener("click", () => selectDate(dateStr, cell));

                    if (agendas[dateStr]) {
                        cell.classList.add("has-agenda");
                        if (!firstActiveCell) {
                            firstActiveCell = { cell, dateStr };
                        }
                    }

                    date++;
                }
                row.appendChild(cell);
            }
            calendarBody.appendChild(row);
        }

        if (firstActiveCell) {
            firstActiveCell.cell.classList.add("active");
            selectDate(firstActiveCell.dateStr, firstActiveCell.cell);
        } else {
            agendaBox.innerHTML = `<p style="color:#999;">No agenda on this month.</p>`;
        }
    }

    function selectDate(dateStr, cell) {
        document.querySelectorAll(".calendar-table td").forEach(td => td.classList.remove("active"));
        cell.classList.add("active");
        showAgenda(dateStr);
    }

    function showAgenda(dateStr) {
        agendaBox.innerHTML = "";
        const items = agendas[dateStr];
        if (items) {
            items.forEach(item => {
                const div = document.createElement("div");
                div.className = "agenda-item";
                div.innerHTML = `
            <div>
              <div class="agenda-title">${item.title}</div>
              <div class="agenda-note">${item.note}</div>
                  <div class="agenda-location"><i class="fas fa-map-marker-alt"></i> ${item.location || '-'}</div>
            </div>
            <div class="agenda-time">${item.time}</div>
          `;
                agendaBox.appendChild(div);
            });
        } else {
            agendaBox.innerHTML = `<p style="color:#999;">No agenda on this date.</p>`;
        }
    }

    document.getElementById("prev").onclick = () => {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        generateCalendar(currentMonth, currentYear);
    };

    document.getElementById("next").onclick = () => {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        generateCalendar(currentMonth, currentYear);
    };


    generateCalendar(currentMonth, currentYear);
</script>

</body>
</html>
