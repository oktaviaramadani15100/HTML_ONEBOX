<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Rules</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .menu-icon {
            color: #f9fafb;
            margin-left: 1rem;
            font-size: 1.2rem;
        }

        .menu-icon i {
            color: #f9fafb;
        }

        .content {
            flex: 1;

        }

        h2 {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 1rem;
        }

        .agent-rules {
            font-family: 'Inter', sans-serif;
            padding: 16px;
        }


        .title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .icon-tabs {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            border-bottom: 1px solid #9a9ea5;
            padding-bottom: 10px;
        }

        .icon-tabs i {
            font-size: 20px;
            color: #1e3a8a;
            padding: 8px;
        }


        .rules-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .rule-item {
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;

        }

        .rule-title {
            font-size: 1rem;
            font-weight: 500;
            margin: 0;
        }

        .rule-date {
            font-size: 0.85rem;
            color: #6b7280;
            margin: 4px 0 0 0;
        }

        .rule-wrapper {
            margin-top: 12px;
        }

        .rule-paragraph {
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: justify;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .dropdown {
            display: none;
            position: absolute;
            right: 20px;
            top: 40px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            width: 170px;
            z-index: 100;
            animation: fadeIn 0.2s ease-in-out;
            padding: 10px 0;
            font-family: 'Segoe UI', sans-serif;
        }

        .dropdown-header {
            text-align: center;
            padding: 12px 16px;
        }

        .dropdown-header p {
            margin: 2px 0;
            font-size: 13px;
            color: #333;
        }

        .dropdown-header .welcome-text {
            font-weight: bold;
            color: #1e3a8a;
        }

        .agent-role {
            font-style: italic;
            font-weight: 400;
            font-size: 13px;
            color: #6b7280;
            margin-top: 2px;
        }

        .dropdown a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            padding: 6px 8px;
            font-size: 14px;
            color: #1e3a8a;
            transition: background-color 0.25s, color 0.25s;
            border-left: 4px solid transparent;
            margin-left: 1rem;
        }

        a+a {
            margin-top: 4px;
        }

        .dropdown a:hover {
            background-color: #f0f4ff;
            border-left: 4px solid #1e3a8a;
        }

        .dropdown i {
            font-size: 16px;
            color: #1e3a8a;
            width: 18px;
            text-align: center;
        }

        .dropdown span {
            flex: 1;
            font-weight: 500;
        }

        .dropdown hr {
            margin: 10px 0;
            border: 0;
            border-top: 1px solid #eee;
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-icon-group {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            position: relative;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div id="header-container"></div>

        <!-- Content -->
        <div class="content">
            <div class="agent-rules">
                <div class="icon-tabs">
                    <i class="fas fa-file-alt active"></i>
                    <i class="fas fa-phone"></i>
                    <i class="fas fa-comment-alt"></i>
                    <i class="fas fa-bell"></i>
                    <i class="fas fa-graduation-cap"></i>
                </div>

                <div class="rules-list" id="rulesList">
                    <div class="rule-item" onclick="showDetails('Kode Etik Agent', '22 Jul 2025', 
                        `Sebagai Agent, Anda wajib menjaga integritas, bersikap profesional, dan menjaga kerahasiaan seluruh data nasabah. Hindari penyalahgunaan informasi, serta jaga reputasi perusahaan dalam setiap interaksi.`)
                        ">
                        <p class="rule-title">Kode Etik Agent</p>
                        <p class="rule-date">22 Jul 2025</p>
                    </div>

                    <div class="rule-item" onclick="showDetails('Aturan Penanganan Nasabah', '20 Jul 2025', 
                        `Jika menghadapi kendala dengan nasabah atau terjadi kasus khusus, segera hubungi tim pendukung melalui aplikasi resmi. Jangan mengambil keputusan sendiri yang berpotensi menyalahi prosedur.`)
                        ">
                        <p class="rule-title">Aturan Penanganan Nasabah</p>
                        <p class="rule-date">20 Jul 2025</p>
                    </div>

                    <div class="rule-item" onclick="showDetails('Panduan Komunikasi Tim', '18 Jul 2025', 
                        `Hanya tawarkan produk yang terdaftar dan aktif. Sampaikan informasi secara akurat dan transparan. Ikuti alur komunikasi sesuai SOP, dan pastikan nasabah memberikan persetujuan dengan jelas sebelum melanjutkan proses.`)
                        ">
                        <p class="rule-title">Panduan Komunikasi Tim</p>
                        <p class="rule-date">18 Jul 2025</p>
                    </div>

                    <div class="rule-item" onclick="showDetails('Kebijakan Laporan Harian Agen', '17 Jul 2025', 
                        `Setiap agent wajib mengisi laporan harian yang mencakup aktivitas kerja, jumlah prospek, hasil closing, dan hambatan yang ditemui. Laporan harus dikirim tepat waktu setiap hari. Supervisor akan melakukan pengecekan dan menyusun evaluasi mingguan berdasarkan data tersebut.`)
                        ">
                        <p class="rule-title">Kebijakan Laporan Harian Agen</p>
                        <p class="rule-date">17 Jul 2025</p>
                    </div>

                    <div class="rule-item" onclick="showDetails('Standar Training Agen Baru', '15 Jul 2025', 
                        `Sebelum mulai bekerja, agent baru wajib mengikuti pelatihan dasar yang mencakup pemahaman produk, teknik komunikasi, penggunaan sistem, dan etika kerja. Setelah pelatihan, dilakukan evaluasi untuk memastikan kesiapan kerja, serta pendampingan minimal selama 1 minggu pertama.`)
                        ">
                        <p class="rule-title">Standar Training Agen Baru</p>
                        <p class="rule-date">15 Jul 2025</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="bottom-nav-container"></div>
    </div>
</body>

</html>

<script>
        fetch('../agent/layout.html')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(data, 'text/html');

                const layoutStyles = doc.querySelectorAll('style');
                layoutStyles.forEach(style => {
                    const newStyle = document.createElement('style');
                    newStyle.textContent = style.textContent;
                    document.head.appendChild(newStyle);
                });

                const layoutLinks = doc.querySelectorAll('link');
                layoutLinks.forEach(link => {
                    if (link.href.includes('style.css')) {
                        const newLink = document.createElement('link');
                        newLink.rel = 'stylesheet';
                        newLink.href = '../agent/css/style.css';
                        document.head.appendChild(newLink);
                    }
                });

                const header = doc.querySelector('.header').cloneNode(true);
                document.getElementById('header-container').appendChild(header);
                const headerTitle = document.querySelector('#header-container .header-name');
                headerTitle.innerHTML = `<i class="fas fa-arrow-left"></i> <span style="margin-left: 16px;">Agent Rules</span>`;
                headerTitle.onclick = () => window.location.href = '../agent/home.html';

                const bottomNav = doc.querySelector('.bottom-nav').cloneNode(true);
                if (bottomNav) {
                    document.getElementById('bottom-nav-container').appendChild(bottomNav);
                } else {
                    console.error('Bottom navigation not found in layout.html');
                }

                const layoutScripts = doc.querySelectorAll('script');
                layoutScripts.forEach(script => {
                    const newScript = document.createElement('script');
                    if (script.src) {
                        newScript.src = '../agent/js/script.js';
                    } else {
                        newScript.textContent = script.textContent;
                    }
                    document.body.appendChild(newScript);
                });
            })
            .catch(error => console.error('Error fetching layout.html:', error));

    function toggleDropdown() {
        const dropdown = document.getElementById('dropdownMenu');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    window.addEventListener('click', function (e) {
        const dropdown = document.getElementById('dropdownMenu');
        const icon = document.querySelector('.fa-ellipsis-v');

        if (!e.target.closest('#dropdownMenu') && !e.target.closest('.fa-ellipsis-v')) {
            dropdown.style.display = 'none';
        }
    });

    const rulesBackup = document.getElementById('rulesList').innerHTML;

    function showDetails(title, date, contents) {
        const container = document.getElementById('rulesList');
        container.innerHTML = '';

        const selectedItem = document.createElement('div');
        selectedItem.className = 'rule-item';
        selectedItem.innerHTML = `
        <p class="rule-title">${title}</p>
        <p class="rule-date">${date}</p>
    `;
        container.appendChild(selectedItem);

        const wrapper = document.createElement('div');
        wrapper.className = 'rule-wrapper';

        const contentArray = Array.isArray(contents) ? contents : [contents];

        contentArray.forEach(content => {
            const paragraph = document.createElement('div');
            paragraph.className = 'rule-paragraph';
            paragraph.innerText = content;
            wrapper.appendChild(paragraph);
        });

        container.appendChild(wrapper);
    }


    function resetRules() {
        document.getElementById('rulesList').innerHTML = rulesBackup;
    }
</script>
