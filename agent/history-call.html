<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f3f4f6;
            display: flex;
            height: 100vh;
            overflow: hidden;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
            padding-bottom: 100px;
            overflow: hidden;
        }

        .content h2 {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .table-wrapper {
            width: 100%;
            margin-top: 12px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            max-height: 400px;
            display: flex;
            flex: 1;
            flex-direction: column;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
        }

        thead {
            background: linear-gradient(90deg, #1e3a8a, #2b4db3);
            color: white;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        thead th {
            font-family: 'DM Sans', sans-serif;
            padding: 14px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: start;
            border-right: none;
        }

        tbody {
            display: block;
            max-height: 350px;
            overflow-y: auto;
            width: 100%;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f9fafb;
        }

        tbody::after {
            content: '';
            display: block;
            height: 30px;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        thead,
        tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        tbody td {
            font-family: 'DM Sans', sans-serif;
            padding: 12px 16px;
            font-size: 12px;
            color: #111827;
            border-bottom: 1px solid #e5e7eb;
            text-align: start;
        }

        tbody td.no-data {
            text-align: center;
            font-weight: 500;
            color: #6b7280;
            padding: 20px 0;
        }

        thead th,
        tbody td {
            padding: 14px 25px;
            text-align: start;
            word-wrap: break-word;
        }

        thead th:nth-child(1),
        tbody td:nth-child(1) {
            width: 30%;
        }

        thead th:nth-child(2),
        tbody td:nth-child(2) {
            width: 40%;
        }

        thead th:nth-child(3),
        tbody td:nth-child(3) {
            width: 30%;
        }

        tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }

        .search-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 20px 15px;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            margin: 10px 0 20px;
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: white;
            border: 1.5px solid #ddd;
            border-radius: 25px;
            padding: 8px 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .search-box input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 11px;
            font-family: 'Poppins', sans-serif;
        }

        .search-box .filter-icon {
            font-size: 14px;
            color: #1e3a8a;
            cursor: pointer;
            margin-left: 8px;
        }

        .search-box i {
            color: #64748b;
            font-size: small;
        }


        .filter-icon {
            font-size: 1.2rem;
            cursor: pointer;
            color: #1e3a8a;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            background-color: #e0e7ff;
            font-family: 'Poppins', sans-serif;
            color: #1e3a8a;
            border: 1px solid #1e3a8a;
            border-radius: 20px;
            padding: 7px 15px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .filter-btn.active {
            font-weight: 600;
            background-color: #1e3a8a;
            color: white;
        }

        .filter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 998;
        }

        .filter-drawer {
            background: #ffffff;
            width: 90%;
            max-width: 320px;
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.25s ease;
        }

        .filter-overlay.open {
            display: flex;
        }

        .filter-overlay.open .filter-drawer {
            transform: scale(1);
            opacity: 1;
        }

        .filter-drawer.open {
            right: 0;
            top: 8.5rem;
        }

        @media screen and (min-width: 768px) {
            .filter-drawer.open {
                right: 30rem;
                top: 8.5rem;
            }
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .filter-header h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            color: #1e3a8a;
        }

        .filter-header i {
            font-size: 1.3rem;
            cursor: pointer;
            color: #1e3a8a;
        }

        .filter-content label {
            font-size: 0.85rem;
            font-family: 'Poppins', sans-serif;
            margin: 10px 0 4px;
            display: block;
        }

        .filter-content input,
        .filter-content select,
        .filter-content button {
            width: 100%;
            padding: 8px;
            font-size: 0.9rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .filter-content button {
            background-color: #1e3a8a;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .filter-content button:hover {
            background-color: #374ba1;
        }

        .filter-actions {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .filter-actions button {
            flex: 1;
            border-radius: 6px;
            padding: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
        }

        .filter-actions .reset-btn {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            color: #374151;
        }

        .filter-actions .reset-btn:hover {
            background-color: #1e3a8a;
            color: white;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            background: #f3f4f6;

        .wrapper {

        .menu-icon {

        .menu-icon-group {

        }

        .dropdown {

            top: 40px;
            background-color: #fff;
            border-radius: 12px;

            margin-top: 2px;
        }

        .dropdown a {

            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;

            font-size: 13px;

        }

        a+a {

        .dropdown a:hover {

        }

        .dropdown i {
            font-size: 16px;

        }

        .dropdown span {

            font-weight: 500;
        }

        .dropdown hr {
            margin: 10px 0;
            border: 0;
            border-top: 1px solid #eee;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 400px;
            border-top: 1px solid #ccc;
            justify-content: space-around;
            align-items: flex-end;
            padding: 10px 0;
            font-size: 11px;
            z-index: 100;
            background: white;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-wrapper i {
            color: #1e3a8a;
        }

        .nav-wrapper>div {
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
            color: #1e3a8a;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-spacer {
            flex: 0.5;
        }

        .nav-wrapper i {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .nav-wrapper p {
            margin-top: 2px;
            font-weight: 600;
            font-size: 0.60rem;
        }

        .bottom-nav a {
            text-decoration: none;
            color: inherit;
        }

        .nav-new {
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            text-decoration: none;
            box-sizing: border-box;
            border: none;
            padding: 0;
            transition: none;
            touch-action: manipulation;
            position: absolute;
            z-index: 20;
            display: flex;
            flex-direction: column;
            text-align: center;
            top: -22px;
            left: 51%;
            transform: translateX(-50%);
        }

        .plus-btn {
            background-color: #1e3a8a;
            border-radius: 50%;
            width: 53px;
            height: 53px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            font-size: 30px;
        }

        .nav-new i {
            font-size: 30px;
            display: block;
            margin-bottom: -2px;
            color: white;
        }

        .nav-new p {
            font-weight: 600;
            margin: 8px 0 0;
            font-size: 0.60rem;
            color: #1e3a8a;
        }

        @media (min-width: 768px) {
            body {
                background: #d1d5db;
            }
        }
    </style>
</head>

<script>
    // fetch('layout.html')
    //     .then(response => response.text())
    //     .then(data => {
    //         document.getElementById('layout-container').innerHTML = data;

    //         document.getElementById('page-title').textContent = 'Call History';
    //     });
    fetch('layout.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('layout-container').innerHTML = data;

            document.getElementById('page-title').textContent = 'Call History';
        });


    function updateResultOptions() {
        const resultSelect = document.getElementById("result");
        const resultLabel = document.getElementById("resultLabel");
        resultSelect.innerHTML = '<option value="">-- Pilih --</option>';

        let options = [];
        if (currentCategory === "activity") {
            resultLabel.textContent = "Result";
            options = ["Thinking", "Call", "Follow Up", "Meeting"];
        } else {
            resultLabel.textContent = "Premium";
            options = ["Hot", "Cold", "Win", "Lose", "Warm"];
        }

        options.forEach(opt => {
            const optionEl = document.createElement("option");
            optionEl.value = opt;
            optionEl.textContent = opt;
            resultSelect.appendChild(optionEl);
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
        function toggleFilter(forceClose = false) {
            const overlay = document.getElementById("filterOverlay");
            if (forceClose) {
                overlay.classList.remove("open");
            } else {
                overlay.classList.toggle("open");
            }
        }

        function applyFilter() {
            activeFilters.date = document.getElementById("date").value;
            activeFilters.prospect = document.getElementById("prospect").value.toLowerCase();
            activeFilters.result = document.getElementById("result").value;

            renderTable();
            document.getElementById("filterOverlay").classList.remove("open");
        }

        const iconFilter = document.querySelector('.filter-icon');
        if (iconFilter) {
            iconFilter.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleFilter();
            });
        }

        const closeIcon = document.getElementById('closeFilter');
        if (closeIcon) {
            closeIcon.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleFilter(true);
            });
        }

        const overlay = document.getElementById("filterOverlay");
        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) {
                toggleFilter(true);
            }
        });

        window.applyFilter = applyFilter;
    });

    function filterCategory(type) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.filter-btn[onclick*="${type}"]`).classList.add('active');

        renderTable(type);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderTable('activity');
    });

    let currentCategory = 'activity';
    let searchQuery = '';

    let activeFilters = {
        date: '',
        prospect: '',
        result: ''
    };

    function filterCategory(type) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.filter-btn[onclick*="${type}"]`).classList.add('active');
        currentCategory = type;
        updateResultOptions();
        renderTable();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.querySelector('.search-box input');
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderTable();
        });

        updateResultOptions();
        renderTable();
    });

    const data = {
        activity: [
            { tanggal: '07/07/25', prospect: 'Ahmad Yusuf', result: 'Thinking' },
            { tanggal: '07/07/25', prospect: 'Rina Marlina', result: 'Call' },
            { tanggal: '07/07/25', prospect: 'Joko Susanto', result: 'Follow Up' },
            { tanggal: '07/07/25', prospect: 'Intan Permata', result: 'Call' },
            { tanggal: '07/07/25', prospect: 'Doni Saputra', result: 'Thinking' },
            { tanggal: '07/07/25', prospect: 'Budi Raharjo', result: 'Meeting' },
            { tanggal: '07/07/25', prospect: 'Sari Widya', result: 'Follow Up' },
            { tanggal: '07/07/25', prospect: 'Hendra Gunawan', result: 'Call' },
            { tanggal: '07/07/25', prospect: 'Nina Oktaviani', result: 'Thinking' },
            { tanggal: '07/07/25', prospect: 'Tono Hartono', result: 'Meeting' },
        ],
        sales: [
            { tanggal: '07/07/25', prospect: 'Ahmad Yusuf', result: 'Win' },
            { tanggal: '07/07/25', prospect: 'Rina Marlina', result: 'Lose' },
            { tanggal: '07/07/25', prospect: 'Joko Susanto', result: 'Hot' },
            { tanggal: '07/07/25', prospect: 'Intan Permata', result: 'Cold' },
            { tanggal: '07/07/25', prospect: 'Doni Saputra', result: 'Lose' },
            { tanggal: '07/07/25', prospect: 'Susanto', result: 'Warm' },
        ]
    };

    function applyFilter() {
        activeFilters.date = document.getElementById("date").value;
        activeFilters.prospect = document.getElementById("prospect").value.toLowerCase();
        activeFilters.result = document.getElementById("result").value;
        renderTable();
        document.getElementById("filterOverlay").classList.remove("open");
    }

    function resetFilter() {
        activeFilters = { date: '', prospect: '', result: '' };
        document.getElementById("date").value = '';
        document.getElementById("prospect").value = '';
        document.getElementById("result").value = '';
        renderTable();
        document.getElementById("filterOverlay").classList.remove("open");
    }

    function renderTable() {
        const tableBody = document.getElementById("tableBody");
        const tableHead = document.querySelector("thead tr");

        tableHead.innerHTML = `
        <th>Tanggal</th>
        <th>Prospect</th>
        <th>${currentCategory === 'sales' ? 'Premium' : 'Result'}</th>
      `;

        let filteredData = data[currentCategory].filter(row =>
            row.tanggal.toLowerCase().includes(searchQuery) ||
            row.prospect.toLowerCase().includes(searchQuery) ||
            row.result.toLowerCase().includes(searchQuery)
        );

        if (activeFilters.date) {
            filteredData = filteredData.filter(row => row.tanggal === activeFilters.date);
        }
        if (activeFilters.prospect) {
            filteredData = filteredData.filter(row => row.prospect.toLowerCase().includes(activeFilters.prospect));
        }
        if (activeFilters.result) {
            filteredData = filteredData.filter(row => row.result === activeFilters.result);
        }

        tableBody.innerHTML = '';
        if (filteredData.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="3" class="no-data">Tidak ada data</td></tr>`;
        } else {
            filteredData.forEach(row => {
                tableBody.innerHTML += `
            <tr>
              <td>${row.tanggal}</td>
              <td>${row.prospect}</td>
              <td>${row.result}</td>
            </tr>
          `;
            });
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.querySelector('.search-box input');
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderTable();
        });

        updateResultOptions();
        renderTable();
    });
</script>
