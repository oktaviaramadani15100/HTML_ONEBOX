<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: #f3f4f6;
        display: flex;
        height: 100vh;
        overflow: hidden;
        justify-content: center;
    }

    .wrapper {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .content {
        flex: 1;
        padding-bottom: 100px;
        overflow: hidden;
    }

    .content h2 {
        font-size: 1.2rem;
        font-weight: bold;
        color: #1f2937;
        margin-bottom: 1rem;
    }
</style>
<body>
    <div class="wrapper">
        <div id="header-container"></div>

    <div class="content">
    </div>

    <div id="bottom-nav-container"></div>
    </div>
<script>
    fetch('../agent/layout.html')
        .then(response => response.text())
        .then(data => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(data, 'text/html');

            const layoutStyles = doc.querySelectorAll('style');
            layoutStyles.forEach(style => {
                const newStyle = document.createElement('style');
                newStyle.textContent = style.textContent;
                document.head.appendChild(newStyle);
            });

    const layoutLinks = doc.querySelectorAll('link');
    layoutLinks.forEach(link => {
        if (link.href.includes('style.css')) {
            const newLink = document.createElement('link');
            newLink.rel = 'stylesheet';
            newLink.href = '../agent/css/style.css';
            document.head.appendChild(newLink);
        }
    });

    const header = doc.querySelector('.header').cloneNode(true);
    document.getElementById('header-container').appendChild(header);
    const headerTitle = document.querySelector('#header-container .header-name');     
    
    headerTitle.innerHTML = `<i class="fas fa-arrow-left"></i> <span style="margin-left: 16px;">Profile</span>`;
    headerTitle.onclick = handleBack;

    const bottomNav = doc.querySelector('.bottom-nav').cloneNode(true);
    if (bottomNav) {
        document.getElementById('bottom-nav-container').appendChild(bottomNav);
    } else {
        console.error('Bottom navigation not found in layout.html');
    }

    const layoutScripts = doc.querySelectorAll('script');
    layoutScripts.forEach(script => {
        const newScript = document.createElement('script');
        if (script.src) {
            newScript.src = '../agent/js/script.js';
        } else {
            newScript.textContent = script.textContent;
        }
            document.body.appendChild(newScript);
        });

    const navHome = document.querySelector('.nav-home');
    if (navHome) navHome.classList.add('active');
    })
    .catch(error => console.error('Error fetching layout.html:', error));

    function handleBack() {
        window.location.href = '../agent/home.html';
    }
</script>
</body>
</html>
