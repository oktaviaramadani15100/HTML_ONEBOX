<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: #f3f4f6;
        display: flex;
        height: 100vh;
        overflow: hidden;
        justify-content: center;
    }

    .wrapper {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(50deg, #1E3A8A 20%, #2563EB 100%, #1E40AF 100%);
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }

    .menu-icon i {
    color: #f9fafb;
    }

    .header-right i {
      font-size: 18px;
      margin-right: 5px;
      color: #f9fafb;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.1rem;
    }

    .header img {
      height: 40px;
    }

    .menu-icon {
      font-size: 20px;
      color: #f9fafb;
      cursor: pointer;
      transition: color 0.3s;
      margin-right: 1rem;
    }

    .dropdown {
      display: none;
      position: absolute;
      right: 30px;
      top: 40px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      width: 170px;
      z-index: 100;
      animation: fadeIn 0.2s ease-in-out;
      padding: 10px 0;
      font-family: 'Poppins', sans-serif;
    }

    .agent-role {
      font-style: italic;
      font-weight: 400;
      font-size: 13px;
      color: #6b7280;
      margin-top: 2px;
    }

    .dropdown a {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      padding: 6px 8px;
      font-size: 13px;
      color: #1e3a8a;
      transition: background-color 0.25s, color 0.25s;
      border-left: 4px solid transparent;
    }

    a+a {
      margin-top: 4px;
    }

    .dropdown a:hover {
      background-color: #f0f4ff;
      border-left: 4px solid #1e3a8a;
    }

    .dropdown i {
      font-size: 16px;
      color: #1e3a8a;
      width: 18px;
      text-align: center;
    }

    .dropdown span {
      flex: 1;
      font-weight: 500;
    }

    .dropdown hr {
      margin: 10px 0;
      border: 0;
      border-top: 1px solid #eee;
    }


    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

           .bottom-nav {
            position: sticky;
            bottom: -1px;
            left: 0;
            right: 0;
            border-top: 1px solid #ccc;
            justify-content: space-around;
            align-items: flex-end;
            padding: 10px 0;
            font-size: 11px;
            z-index: 10;
            margin-top: 1.5rem;
            background: white;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-wrapper i {
            color: #1e3a8a;
        }

        .nav-wrapper>div {
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
            color: #1e3a8a;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-spacer {
            flex: 0.5;
        }

        .nav-wrapper i {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .nav-wrapper p {
            margin-top: 2px;
            font-weight: 600;
            font-size: 0.60rem;
        }

        .bottom-nav a {
            text-decoration: none;
            color: inherit;
        }

        .nav-new {
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            text-decoration: none;
            box-sizing: border-box;
            border: none;
            padding: 0;
            transition: none;
            touch-action: manipulation;
            position: absolute;
            z-index: 20;
            display: flex;
            flex-direction: column;
            text-align: center;
            top: -22px;
            left: 51%;
            transform: translateX(-50%);
        }

        .plus-btn {
            background-color: #1e3a8a;
            border-radius: 50%;
            width: 53px;
            height: 53px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            font-size: 30px;
        }

        .nav-new i {
            font-size: 30px;
            display: block;
            margin-bottom: -2px;
            color: white;
        }

        .nav-new p {
            font-weight: 600;
            margin: 8px 0 0;
            font-size: 0.60rem;
            color: #1e3a8a;
        }


    .header a {
      text-decoration: none;
      color: #1e3a8a;
    }

    .header-right {
      margin-left: 157px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header .header-name {
      text-decoration: none;
      color: #f9fafb;
      font-size: 15px;
      font-weight: bold;
    }

    @media (min-width: 768px) {
      body {
        background: #d1d5db;
      }
    }

    .notif-icon {
      font-size: 18px;
      margin-right: 5px;
      color: #f9fafb;
      cursor: pointer;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      -ms-overflow-style: none; 
      scrollbar-width: none; 
      position: relative;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .content h2 {
        font-size: 1.2rem;
        font-weight: bold;
        color: #1f2937;
        margin-bottom: 1rem;
    }

    .profile-info {
      position: absolute;
      top: 120px;
      left: 21%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      border: 3.5px solid #fff;
      position: relative; 
      cursor: pointer;
    }

    .profile-pic::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.2);
      opacity: 1;
      z-index: 1;
    }

    .profile-pic i {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 28px;
      pointer-events: none;
      z-index: 2;
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-details {
      margin-top: 170px;
      padding: 20px 40px 10px;
    }

    .detail-item {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-item label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .detail-item p {
      font-size: 12px;
      font-weight: 600;
      color: #111827;
    }

    .content-image {
      position: fixed;
      top: 50px; 
      left: 0;
      right: 0;
      max-width: 400px; 
      margin: auto;
      z-index: 50;
      text-align: center;
    }

    .content-image img {
      max-width: 100%;
      max-height: 150px;
      object-fit: cover;
    }
</style>
<body>
<div class="wrapper">
    <div class="header">
      <div class="header-top">
        <a href="../agent/home.html" class="header-name"> 
          <i class="fa-solid fa-arrow-left"></i> 
          <span style="margin-left: 16px;">Profile</span>
        </a>

        <div class="header-right">
          <i class="fas fa-envelope" onclick="window.location.href='inbox.html'"></i>
          <i class="fa-solid fa-bell notif-icon" onclick="window.location.href='notification.html'"></i>
          <i class="fa-solid fa-ellipsis-vertical menu-icon" onclick="toggleDropdown()"></i>
        </div>
      </div>

      <div class="profile-info">
      <div class="profile-pic">
        <i class="fa-solid fa-camera"></i>
        <img src="../img/profile2.jpg" alt="Profile">
      </div>
      </div>

      <div class="dropdown" id="dropdownMenu">
        <a href="../agent/profile.html"><i class="fa-solid fa-user"></i><span>Profile</span></a>
        <a href="../agent/agent-rules.html"><i class="fa-solid fa-user-shield"></i><span>Agent Rules</span></a>
        <a href="#"><i class="fa-solid fa-circle-question"></i><span>FAQ</span></a>
        <hr>
      </div>
    </div>

    <div class="content">
        <div class="content-image">
          <img src="../img/header.png">
        </div>
      <div class="profile-details">
        <div class="detail-item">
          <label>Nama Lengkap</label>
          <p>ATM Agent</p>
        </div>
        <div class="detail-item">
          <label>ID User</label>
          <p>ATM-1234567</p>
        </div>
        <div class="detail-item">
          <label>Email</label>
          <p>atm.agent@msiglife.co.id</p>
        </div>
        <div class="detail-item">
          <label>Nomor Telepon</label>
          <p>+62 812 3456 7890</p>
        </div>
        <div class="detail-item">
          <label>Cabang</label>
          <p>Jakarta Pusat</p>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-wrapper">
        <div class="nav-home active">
          <a href="../agent/home.html"><i class="fas fa-home"></i></a>
          <p>Home</p>
        </div>
        <div class="nav-history">
          <a href="../agent/history-call.html"><i class="fas fa-file-alt"></i></a>
          <p>History</p>
        </div>
        <div class="nav-spacer"></div>
        <div class="nav-call">
          <a href="../agent/call.html"><i class="fas fa-phone-alt"></i></a>
          <p>Call</p>
        </div>
        <div class="nav-agen">
          <a href="../agent/agenda.html"><i class="fas fa-calendar-alt"></i></a>
          <p>Agenda</p>
        </div>
      </div>
      <div class="nav-new">
        <a href="../agent/New-sales.html" class="plus-btn"><i class="fas fa-plus"></i></a>
        <p>New</p>
      </div>
    </div>
  </div>
<script>
    function handleBack() {
        window.location.href = '../agent/home.html';
    }
</script>
</body>
</html>
