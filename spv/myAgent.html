<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Agent</title>
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f3f4f6;
        display: flex;
        justify-content: center;
    }

    .wrapper {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    }

    .agent-header {
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 50; 
    padding: 1rem;
    }

    .agent-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    }

    .agent-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    }

    .agent-list {
        flex: 1;
        overflow-y: auto; 
        margin-top: -5px;
        margin-bottom: 5rem;
        padding: 1rem;
        scrollbar-width: none; 
        -ms-overflow-style: none;
    }

    .agent-list::-webkit-scrollbar {
        display: none; 
    }

    .agent-card {
    background: #fff;
    border: 1px solid #1e3a8a;
    border-radius: 8px;
    padding: 15px 10px;
    cursor: pointer;
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    position: relative;
    }

    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(37, 99, 235, 0.15);
        color: #1e3a8a;
        font-size: 16px;
        font-weight: 600;
        text-transform: uppercase;
    }

    .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;   
        object-position: center;
        display: block;
    }

    .agent-info {
    display: flex;
    flex-direction: column;
    }

    .agent-info .name {
    font-weight: 700;
    font-size: 14px;
    color: #111827;
    }

    .agent-info .sales {
        font-size: 13px;
        margin-top: 2px;
        font-weight: 500;
        color: #333;
    }

    .agent-info .account {
    font-size: 11px;
    color: #6b7280;
    }

    .icon-btn {
        font-size: 24px;
        cursor: pointer;
        color: #1d0c80;
        padding: 6px;
        border-radius: 6px;
        transition: background 0.2s;
    }

    .icon-btn:hover {
        background: #f0f0f0;
    }

    .filter-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 16px;
    }

    .filter-btn-reset {
        background: #f9fafb;
        border: 1px solid #d1d5db;
        color: #111827;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 12px;
        font-family: 'Poppins' sans-serif;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
    }
    .filter-btn-reset:hover {
        background: #f3f4f6;
        border-color: #9ca3af;
    }

    .filter-btn-apply {
        background: #1e3a8a;
        border: none;
        color: #fff;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 12px;
        font-family: 'Poppins' sans-serif;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }
    .filter-btn-apply:hover {
        background: #162d65;
    }

    .filter-sidebar {
        position: fixed;
        top: 0;
        right: -300px;
        width: 280px;
        height: auto;
        background: white;
        box-shadow: -2px 0 8px rgba(0, 0, 0, 0.1);
        padding: 16px;
        transition: right 0.3s ease;
        z-index: 1000;
        display: none;
    }

    .filter-sidebar.show {
        right: 31rem;
        top: 4rem;
        display: block;
    }

    @media (max-width: 768px) {
        .filter-sidebar.show {
            right: 1rem;
            top: 4rem;
            width: 90%;
            z-index: 999;
        }
    }

    .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%; 
    background: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;     
    }

    .filter-modal {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        width: 90%;
        max-width: 300px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        animation: scaleIn 0.25s ease;
    }

    @keyframes scaleIn {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .filter-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
        margin-bottom: 7px;
        font-size: 18px;
    }

    .close-btn {
        font-size: 24px;
        cursor: pointer;
        margin-left: 12px;
    }

    .filter-label {
        font-size: 17px;
        display: flex;
        align-items: center;
        color: #1e3a8a;
    }

    .filter-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 12px;
    }

    .filter-content select,
    .filter-content input {
        padding: 10px;
        font-family: 'Poppins', sans-serif;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 11px;
        width: 100%;
    }

    .filter-content label {
        font-weight: 500;
        margin-top: 5px;
        color: #000;
        font-size: 12px;
    }

    .search-filter-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 2px;
    }

    .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        background: #fff;
        border: 1.5px solid #cbd5e1;
        border-radius: 999px;
        padding: 8px 14px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .search-box input {
        font-family: 'Poppins', sans-serif;
        border: none;
        outline: none;
        flex: 1;
        font-size: 11px;
        color: #333;
    }

    .search-box i {
        font-size: 12px;
        color: #444;
    }

    .filter-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #1e3a8a;
        color: #fff;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-family: 'Poppins', sans-serif;
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
        transition: background 0.2s;
    }

    .filter-btn:hover {
        background: #162d65;
    }

    .badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #f3e8ff;
    color: #6b21a8;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    }

    .badge.reached {
    background: #e0fce0;
    color: #16a34a;
    }

    .progress-bar {
    width: 50%;
    height: 5px;
    background: #e5e7eb;
    border-radius: 4px;
    overflow: hidden;
    margin: 7px 52px 5px;
    }

    .progress-bar-fill {
        height: 100%;
        background: #1e3a8a;
    }

    .agent-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    }

    .agent-footer .status {
    font-size: 10px;
    margin-left: 53px;
    color: #6b7280;
    }

    .status {
    font-size: 10px;
    margin-left: 64px;
    color: #6b7280;
    display: flex;
    align-items: center;
    gap: 5px;
    }

    .status .divider {
    width: 1px;
    height: 12px;
    background: #d1d5db;
    margin: 0 4px;
    }

    .agent-actions {
        margin-top: -30px;
    display: flex;
    gap: 10px;
    }

    .agent-actions button:hover {
        background: #162d65; 
        transform: scale(1.1);
    }

    .agent-actions button {
    background: #1e3a8a;
    border: none;
    color: #fff;
    font-size: 12px;
    padding: 7px;
    border-radius: 50%;
    cursor: pointer;
    }

    .name-account {
    display: flex;
    align-items: center;
    gap: 10px;
    }

    .name-account .dot {
    width: 4px;
    height: 4px;
    background: #6b7280;
    border-radius: 50%;
    display: inline-block;
    }

    .name-account .account {
    font-size: 10px;
    color: #6b7280;
    display: flex;
    align-items: center;
    gap: 7px;
    }

    .fade-out {
    opacity: 0;
    transition: opacity 0.4s ease;
    }

    .fade-in {
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
    }
</style>

                <div id="filterOverlay" class="overlay">
                <div class="filter-modal">
                    <div class="filter-header">
                        <div class="filter-label">Filter</div>
                        <span class="close-btn" onclick="toggleFilter()">&times;</span>
                    </div>

                        <label for="penjualan">Penjualan Agent</label>
                        <input type="number" id="penjualanAgent" name="penjualanAgent" placeholder="Contoh: 5" />

                        <label for="jumlahPolicy">Jumlah Policy Terjual</label>
                        <input type="number" id="jumlahPolicy" name="jumlahPolicy" placeholder="Contoh: 10" />

                        <input type="number" id="premiTertinggi" name="premiTertinggi" placeholder="Contoh: 1000000" />
                    </div>

                    <div class="filter-actions">
                        <button class="filter-btn-reset" onclick="resetFilter()">Reset</button>
                        <button class="filter-btn-apply" onclick="applyFilter()">Apply</button>
                    </div>
                </div>
            </div> 


    <script>
        function resetFilter() {
            document.getElementById("penjualanAgent").value = "";
            document.getElementById("jumlahPolicy").value = "";
            document.getElementById("premiTertinggi").value = "";
        }

        function applyFilter() {
            document.getElementById("filterOverlay").style.display = "none";
        }

    async function loadLayout() {
    const res = await fetch("../spv/layout.html");
    const html = await res.text();

    const temp = document.createElement("div");
    temp.innerHTML = html;

    document.getElementById("header-container").appendChild(temp.querySelector(".header"));
    document.getElementById("bottom-container").appendChild(temp.querySelector(".bottom-nav"));
    document.getElementById('page-title').textContent = 'My Agent';

    temp.querySelectorAll("link[rel='stylesheet']").forEach(link => {
        if (!document.querySelector(`link[href="${link.href}"]`)) {
        document.head.appendChild(link.cloneNode());
        }
    });

    temp.querySelectorAll("script[src]").forEach(script => {
        if (!document.querySelector(`script[src="${script.src}"]`)) {
        const newScript = document.createElement("script");
        newScript.src = script.src;
        document.body.appendChild(newScript);
        }
    });
    }

    loadLayout();

        function toggleFilter() {
            const overlay = document.getElementById('filterOverlay');
            overlay.style.display = (overlay.style.display === 'flex') ? 'none' : 'flex';
        }

        document.getElementById("filterOverlay").addEventListener("click", function(e) {
            if (e.target === this) {
                this.style.display = "none";
            }
        });

        document.addEventListener("click", function (e) {
            const sidebar = document.getElementById("filterSidebar");
            const isClickInside = sidebar.contains(e.target);
            const isFilterButton = e.target.closest(".filter-btn");

            if (!isClickInside && !isFilterButton) {
                sidebar.classList.remove("show");
            }
        });

        document.getElementById("searchInput").addEventListener("input", filterAgents);

        function filterAgents() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        const cards = document.querySelectorAll(".agent-card");
        const noDataMessage = document.getElementById("noDataMessage");

        let visibleCount = 0;

        cards.forEach(card => {
            const name = card.querySelector(".name").textContent.toLowerCase();
            const account = card.querySelector(".account").textContent.toLowerCase();
            const sales = card.querySelector(".sales").textContent.toLowerCase();

            if (name.includes(query) || account.includes(query) || sales.includes(query)) {
            card.style.display = "flex"; 
            visibleCount++;
            } else {
            card.style.display = "none"; 
            }
        });

        if (visibleCount === 0) {
            noDataMessage.style.display = "block";
        } else {
            noDataMessage.style.display = "none";
        }
        }

        document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("fade-in");

        document.querySelectorAll(".agent-card").forEach(card => {
            card.addEventListener("click", (e) => {
            e.preventDefault();
            document.body.classList.add("fade-out");
            setTimeout(() => {
                window.location.href = "myAgent-detail.html";
            }, 400);
            });
        });
        });
    </script>
